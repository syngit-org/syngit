name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Restrict the default GITHUB_TOKEN to read-only; jobs widen it where needed.
permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
      # Needed by cosign to request an OIDC token for keyless signing
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      # Base64-encoded sha256 digests of the released artifacts, consumed by the provenance job
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2

      - name: Resolve the chart version from the git tag
        run: |
          echo "CHART_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Package chart
        run: |
          helm package charts/syngit \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}"

      - name: Sign the release artifacts
        id: hash
        run: |
          set -euo pipefail

          sha256sum *.tgz > checksums.txt
          echo "hashes=$(base64 -w0 < checksums.txt)" >> "$GITHUB_OUTPUT"

          # Keyless (OIDC) signing: no private key to manage, the identity of the
          # workflow is bound to the certificate and logged in the Rekor transparency log.
          # The Sigstore bundle carries the signature, the certificate and the Rekor
          # inclusion proof in a single `.bundle` file.
          for file in *.tgz checksums.txt; do
            cosign sign-blob --yes \
              --bundle "${file}.bundle" \
              "${file}"
          done

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: true
          generate_release_notes: true
          append_body: true
          tag_name: ${{ github.ref_name }}
          files: |
            *.tgz
            *.tgz.bundle
            checksums.txt
            checksums.txt.bundle
          body: |
            ### Verifying the release artifacts

            The artifacts are signed with [cosign](https://github.com/sigstore/cosign) keyless signing.
            Download the chart and its `.bundle`, then run:

            ```shell
            cosign verify-blob syngit-${{ github.ref_name }}.tgz \
              --bundle syngit-${{ github.ref_name }}.tgz.bundle \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            ```

            The release also carries SLSA Build Level 3 provenance (`provenance.intoto.jsonl`).
            Verify it with [slsa-verifier](https://github.com/slsa-framework/slsa-verifier):

            ```shell
            slsa-verifier verify-artifact syngit-${{ github.ref_name }}.tgz \
              --provenance-path provenance.intoto.jsonl \
              --source-uri github.com/${{ github.repository }} \
              --source-tag ${{ github.ref_name }}
            ```

      - name: Upload chart package and update Helm index
        run: |
          TAG_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git stash
          git checkout gh-pages

          if [ -f index.yaml ]; then
            helm repo index . --url $TAG_URL --merge index.yaml
          else
            helm repo index . --url $TAG_URL
          fi

          git add index.yaml
          git commit -m "feat(release): Update Helm index for the ${CHART_VERSION} version" || echo "No changes to commit"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  # Generates SLSA Build Level 3 provenance for the chart package and attaches it
  # to the release as `provenance.intoto.jsonl`.
  provenance:
    needs: [release]
    permissions:
      # Needed to read the workflow path used to generate the provenance
      actions: read
      # Needed to request the OIDC token used to sign the provenance
      id-token: write
      # Needed to upload the provenance to the release
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      provenance-name: provenance.intoto.jsonl
      upload-assets: true
