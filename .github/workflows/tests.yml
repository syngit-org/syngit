name: Tests

on:
  # run it on push to the default repository branch
  push:
  pull_request:

# Restrict the default GITHUB_TOKEN to read-only; jobs widen it where needed.
permissions:
  contents: read

jobs:

  tests-build-deploy:
    name: Build & deploy tests
    permissions: {}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Install kubectl
      uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      with:
        version: 'latest'

    - name: Set up KinD
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      with:
        version: v0.33.0
        cluster_name: syngit-dev-cluster

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make

    - name: Run tests
      run: make test-build-deploy

  tests-e2e:
    name: Tests end-to-end
    permissions: {}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make

    - name: Install kubernetes binaries
      run: |
        make envtest-assets

    - name: Run tests
      run: make test-e2e

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: e2e

  tests-unit:
    name: Tests unit
    permissions: {}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make

    - name: Run tests
      run: make test-unit

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage-unit.txt
        flags: unit

  build-image:
    name: Build Docker image
    permissions: {}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Build and export Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        tags: local/syngit-controller:dev
        outputs: type=docker,dest=/tmp/image.tar

    - name: Upload image artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: docker-image
        path: /tmp/image.tar
        retention-days: 1
        overwrite: true

  test-helm-install:
    name: Helm install test
    permissions: {}
    runs-on: ubuntu-latest
    needs: build-image

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Download image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: docker-image
        path: /tmp

    - name: Load Docker image
      run: docker load --input /tmp/image.tar

    - name: Install kubectl
      uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      with:
        version: 'latest'

    - name: Set up KinD
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      with:
        version: v0.33.0
        cluster_name: syngit-dev-cluster

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make

    - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4
      name: Run tests
      with:
        timeout_minutes: 10
        max_attempts: 3
        command: go test ./test/e2e/helm/install -v -ginkgo.v

  test-helm-upgrade:
    name: Helm upgrade test
    permissions: {}
    runs-on: ubuntu-latest
    needs: build-image

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Download image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: docker-image
        path: /tmp

    - name: Load Docker image
      run: docker load --input /tmp/image.tar

    - name: Install kubectl
      uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      with:
        version: 'latest'

    - name: Set up KinD
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      with:
        version: v0.33.0
        cluster_name: syngit-dev-cluster

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make
      
    - uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4
      name: Run tests
      with:
        timeout_minutes: 15
        max_attempts: 3
        command: go test ./test/e2e/helm/upgrade -v -ginkgo.v