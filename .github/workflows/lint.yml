name: Lint

on:
  push:
  pull_request:

# Restrict the default GITHUB_TOKEN to read-only; jobs widen it where needed.
permissions:
  contents: read

jobs:
  lint:
    name: Lint the code
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6.4.0
        with:
          go-version: '1.27.0'

      - name: Run linter
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 #v9.2.0
        with:
          version: v2.13.1
          args: --timeout=5m
