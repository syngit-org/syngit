# permissions for end users to edit clusterwideremotesyncers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: syngit
    app.kubernetes.io/managed-by: kustomize
  name: clusterwideremotesyncer-editor-role
rules:
- apiGroups:
  - syngit.io
  resources:
  - clusterwideremotesyncers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - syngit.io
  resources:
  - clusterwideremotesyncers/status
  verbs:
  - get
