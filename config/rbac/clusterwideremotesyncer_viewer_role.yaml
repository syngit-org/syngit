# permissions for end users to view clusterwideremotesyncers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: syngit
    app.kubernetes.io/managed-by: kustomize
  name: clusterwideremotesyncer-viewer-role
rules:
- apiGroups:
  - syngit.io
  resources:
  - clusterwideremotesyncers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - syngit.io
  resources:
  - clusterwideremotesyncers/status
  verbs:
  - get
